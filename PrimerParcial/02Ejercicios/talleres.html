<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talleres - Ejercicios con arreglos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Talleres disponibles</h1>
    </header>
    <main>
        <section class="ejercicio">
            <h2 id="titulo-talleres">Arreglos del código <code>arreglos.js</code></h2>
            <p>Gestión de talleres con JavaScript</p>
 
            <div class="tabla-scroll">
                <table id="tabla-cursos">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                </table>
            </div>
 
            <form id="formulario-cursos" class="formulario">
                <div class="campos">
                    <label for="selector-operacion">Operación:</label>
                    <select name="selector-operacion" id="selector-operacion">
                        <option value="" disabled selected>-- Selecciona una operación --</option>
                        <option value="forEach">forEach</option>
                        <option value="map">map</option>
                        <option value="filter">filter</option>
                        <option value="find">find</option>
                        <option value="reduce">reduce</option>
                        <option value="filter-map">filter + map</option>
                    </select>
                </div>
                <button type="submit">Ejecutar</button>
            </form>
 
            <output class="salida" id="salida-resultado" for="formulario-cursos"></output>
        </section>
    </main>
    <script src="js/app.js"></script>
</body>
</html>
