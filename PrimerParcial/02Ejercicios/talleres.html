<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talleres - Ejercicios con arreglos</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>Talleres disponibles</h1>
    </header>

    <main>
        <section class="ejercicio">
            <h2 id="titulo-talleres">Arreglos del código <code>arreglos.js</code></h2>
            <p>Gestión de talleres con JavaScript</p>

            <div class="tabla-scroll">
                <table id="tabla-talleres">
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Instructor</th>
                            <th>Cupo</th>
                            <th>Inscritos</th>
                        </tr>
                    </thead>
                </table>
            </div>

            <form id="formulario-talleres" class="formulario">
                <div class="talleres">
                    <label for="selector-operacion">Operación:</label>
                    <select id="selector-operacion" name="selector-operacion">
                        <option value="" disabled selected>-- Selecciona una operación --</option>
                        <option value="forEach">Lista simple</option>
                        <option value="map">Solo nombres</option>
                        <option value="filter">Talleres con cupo lleno</option>
                        <option value="find">Nombre del instructor</option>
                        <option value="reduce">Total de inscritos</option>
                        <option value="filter-map">Talleres disponibles</option>
                    </select>
                </div>

                <button type="submit">Ejecutar</button>
            </form>
        </section>

        <section class="ejercicio" aria-labelledby="titulo-objeto">
            <h2 id="titulo-objeto">Segunda parte de ejercicios manejo de Objetos y JSON</h2>

            <p>Edita el taller y elije que operación aplicarle: </p>

            <form class="formulario" id="form-objeto">
                <div class="campo">
                    <label for="obj-nombre">Nombre</label>
                    <input type="text" id="obj-nombre" name="obj-nombre" value="Introducción a Python">
                </div>

                <div class="campo campo-corta">
                    <label for="obj-instructor">Instructor</label>
                    <input type="text" id="obj-instructor" name="obj-instructor" value="Ing. María Lopéz">
                </div>

                <div class="campo campo-corta">
                    <label for="obj-cupo">Cupo</label>
                    <input type="text" id="obj-cupo" name="obj-cupo" value="25" min="0">
                </div>

                <div class="campo campo-corta">
                    <label for="obj-inscritos">Inscritos</label>
                    <input type="text" id="obj-inscritos" name="obj-inscritos" value="25" min="0">
                </div>

                <div class="campo">
                    <label for="operacion-objeto"> Operacion a realizar </label>
                    <select name="operacion-objeto" id="operacion-objeto">
                        <option value="keys">Object.keys</option>
                        <option value="values">Object.values</option>
                        <option value="entries">Object.entries</option>
                        <option value="stringify">Object.stringify</option>
                        <option value="roundtrip">Ida y vuelta de cadena a JSON</option>
                    </select>
                </div>

                <button type="submit"> Ejecutar Opción de Objetos</button>
            </form>

            <output class="resultado" id="resultado-objeto" for="form-objeto"></output>


        </section>

    </main>

    <script src="js/app.js"></script>
</body>
</html>
